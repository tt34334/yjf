services:
  mysql:
    image: mysql:8.0
    container_name: academy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: football_academy
      MYSQL_USER: academy
      MYSQL_PASSWORD: academy123
      TZ: Asia/Hong_Kong
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: academy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: academy-api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://academy:academy123@mysql:3306/football_academy?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      APP_NAME: Football Academy API
      DEBUG: "true"
      EXPORT_DIR: /app/exports
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  mysql_data:
  redis_data:
