# File: docker-compose.yml
# 一键容器化启动：API(8000) + Streamlit 前端(8501)
# 使用前请先执行：Copy-Item .env.example .env  （并填入 OPENAI_API_KEY）
services:
  api:
    build:
      context: .
    container_name: football-rag-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data                        # 文档与向量库持久化
      - hf_cache:/root/.cache/huggingface       # 缓存本地 Embedding 模型，避免重复下载
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
    container_name: football-rag-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hf_cache:
